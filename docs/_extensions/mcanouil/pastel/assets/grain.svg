<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160">
  <!--
    Pastel - Paper tooth.
    Tiled behind the page at low opacity so the ground reads as toothed pastel
    paper rather than flat colour.

    @license MIT
    @copyright 2026 Mickael Canouil
    @author Mickael Canouil

    Fractal noise rather than placed dots: a few hundred bytes instead of tens
    of kilobytes, and `stitchTiles` makes the tile seam-free when repeated.
    The colour matrix drops saturation to zero and then flattens the result to
    a low-alpha black, so the texture darkens whatever it sits on and works
    unchanged in both colour schemes.
  -->
  <filter id="tooth" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" stitchTiles="stitch" result="noise"/>
    <feColorMatrix in="noise" type="saturate" values="0" result="grey"/>
    <feComponentTransfer in="grey">
      <feFuncA type="linear" slope="0.55" intercept="-0.18"/>
    </feComponentTransfer>
  </filter>
  <rect width="160" height="160" filter="url(#tooth)"/>
</svg>
