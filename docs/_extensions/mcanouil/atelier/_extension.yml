title: Atelier
author: Mickaël Canouil
version: 0.10.2
quarto-required: '>=1.9.36'
source: mcanouil/quarto-atelier@0.10.2
source-type: registry
contributes:
  formats:
    common:
      lang: en-GB
      date-format: dddd[, the] Do [of] MMMM, YYYY
      code-copy: true
      code-overflow: wrap
      code-link: false
    html:
      respect-user-color-scheme: true
      canonical-url: true
      theme:
        light:
          - html/chrome.scss
          - brand
          - html/theme.scss
        dark:
          - html/chrome.scss
          - brand
          - html/theme.scss
      syntax-highlighting:
        light: github-light
        dark: github-dark
      toc: true
      toc-depth: 3
      anchor-sections: true
      link-external-newwindow: true
      grid:
        sidebar-width: 300px
        body-width: 1000px
        margin-width: 300px
      filters:
        - social-metadata.lua
      include-before-body:
        - file: html/scripts/skip-link.html
      include-after-body:
        - file: html/scripts/current-year.html
        - file: html/scripts/external-links.html
        - file: html/scripts/ordinal-dates.html
        - file: html/scripts/a11y-fixes.html
        - file: html/scripts/navbar-tooltips.html
  project:
    project:
      type: website
      output-dir: _site
    website:
      repo-actions:
        - edit
        - issue
      repo-link-target: _blank
      repo-link-rel: noopener noreferrer
      open-graph:
        locale: en_GB
      twitter-card:
        card-style: summary_large_image
      page-navigation: true
      back-to-top-navigation: true
      llms-txt: true
      search:
        location: navbar
        type: overlay
      navbar:
        search: true
      page-footer:
        border: true
        left: |
          Powered by [Quarto](https://quarto.org){target="_blank" rel="noopener noreferrer"}.
        center: >
          &copy; []{#current-year} [Mickaël CANOUIL](https://mickael.canouil.fr){target="_blank" rel="noopener
          noreferrer"}.
    format: atelier-html
